[package]
name = "nonograph"
version = "0.5.4"
edition = "2021"

[dependencies]
rocket = { version = "0.5", features = ["json"] } # web server
serde = { version = "1.0", features = ["derive"] } # de/serialize data structures
chrono = { version = "0.4", features = ["serde"] } # handles date and time
rand = "0.8" # random number generator
ammonia = "3.3" # sanitize unsafe strings
toml = "0.8" # parse and validate TOML markup
syntect = "5.1" # code block syntax highlighting
deunicode = "1.4" # transliterates unicode
reqwest = { version = "0.11", features = ["json"] } # not really anywhere in prod yet
serde_json = "1.0" # makes json work
url = "2.4" # URL parsing

[dev-dependencies]
tempfile = "3.0"
serial_test = "3.0"

# make bin smol
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
